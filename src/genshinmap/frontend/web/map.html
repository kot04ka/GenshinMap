<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genshin Interactive Map</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>
  <div id="panel">
    <h1><span id="mapname">Карта</span><span class="badge" id="badge">—</span></h1>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="search" placeholder="Поиск категории…" />
    </div>
    <div class="tools">
      <button class="tbtn" id="btn-hide" title="Не показывать на карте уже собранные точки">Скрыть собранные</button>
      <button class="tbtn" id="btn-clear" title="Выключить все категории">Снять все слои</button>
    </div>
    <div id="active"></div>
    <div id="cats"></div>
    <div id="stat">Загрузка…</div>
  </div>
  <div id="map"></div>
  <div id="regions"></div>
  <div id="minibar">
    <button id="mb-out" title="Отдалить">−</button>
    <button id="mb-in" title="Приблизить">+</button>
    <button id="mb-follow" class="off" title="Следовать за игроком">◎</button>
    <button id="mb-chest" class="off" title="Вести к ближайшему сундуку">🧰</button>
    <button id="mb-clear" title="Зачистка региона: что осталось">🧹</button>
    <button id="mb-route" title="Маршрут по несобранным сундукам региона">🗺</button>
    <button id="mb-home" title="Вся карта">⌂</button>
  </div>
  <div id="lightbox" title="Закрыть"><img alt=""></div>
  <div id="sheet"><button class="sheet-x" title="Закрыть">✕</button><div id="sheet-body"></div></div>
  <div id="maptip"></div>
  <div id="lost" title="Позиция вернётся сама, когда мини-карта снова совпадёт с картой">📍 Позиция не найдена: подземелье или многоуровневая зона (такого уровня нет на карте HoYoLAB), меню или загрузка. Точка — последнее известное место.</div>
  <div id="nav"><span class="arrow">➤</span><span id="nav-txt"></span>
    <button id="nav-path" title="Показать путь: на карте, мини-карте и под ногами (Ctrl+Alt+P)">👣</button>
    <button id="nav-skip" title="Пропустить эту точку маршрута">⏭</button>
    <button id="nav-x" title="Перестать вести (Ctrl+Alt+X)">✕</button></div>
  <div id="loading"><div class="spinner"></div><div>Загрузка карты…</div></div>

  <script src="vendor/leaflet.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="js/state.js"></script>
  <script src="js/map-view.js"></script>
  <script src="js/markers.js"></script>
  <script src="js/card.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
